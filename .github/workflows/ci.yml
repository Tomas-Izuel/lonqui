name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Valores dummy, NO secretos. Alcanzan para que las validaciones Zod de
  # src/lib/env.server.ts y env.client.ts pasen: el build evalúa esos módulos
  # aunque nunca abra una conexión real.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_SECRET_KEY: ci-placeholder-secret-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  build:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      # `PageProps`, `LayoutProps` y `RouteContext` son globales que Next
      # genera en `.next/types/` al correr dev/build/typegen. En un checkout
      # limpio no existen y `tsc --noEmit` falla antes del build.
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint

      # Los tests de tests/db/ se saltean solos sin el stack: acá corren los
      # unitarios; los de base van en el job de abajo.
      - run: npm test

      - run: npm run build

  db:
    name: migraciones · drift de tipos · tests de Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar el stack local
        run: npx supabase start

      - name: Aplicar migraciones + seed
        run: npx supabase db reset

      # El drift entre database.types.ts y las migraciones es silencioso: una
      # columna que cambia de tipo no avisa en ningún lado hasta que algo
      # explota. Si difiere, falla.
      - name: Regenerar tipos y compararlos contra lo commiteado
        run: |
          npx supabase gen types typescript --local --schema public > /tmp/database.types.generated.ts
          if ! diff -q src/lib/supabase/database.types.ts /tmp/database.types.generated.ts > /dev/null; then
            echo "::error::src/lib/supabase/database.types.ts está desactualizado respecto de las migraciones."
            echo "Corré 'npm run db:types' y commiteá el resultado. Diff:"
            diff src/lib/supabase/database.types.ts /tmp/database.types.generated.ts || true
            exit 1
          fi

      # Con el stack arriba, tests/db/ deja de saltearse: RLS por rol, grants,
      # append-only de auditoría, idempotencia de cuotas.
      - name: Tests de invariantes de Postgres
        run: npm test

      - name: Parar el stack
        if: always()
        run: npx supabase stop

  # Migraciones a producción: solo en push a main, después de que pasen los
  # dos jobs de arriba. Serializado y sin cancelar (cortar un `db push` a
  # mitad de camino es peor que esperar). Nunca `supabase config push`:
  # config.toml describe solo el stack local; por lo mismo `--skip-vault`, que
  # evita copiar a producción los secretos de vault de config.toml.
  #
  # Se saltea solo si falta configuración (fork, repo recién clonado):
  #   vars.SUPABASE_PROJECT_REF       ref del proyecto hosted
  #   secrets.SUPABASE_ACCESS_TOKEN   token personal de supabase.com
  #   secrets.SUPABASE_DB_PASSWORD    contraseña de Postgres del proyecto
  # Los secrets viven en el environment `production` del repo. La variable va a
  # nivel repositorio: el `if` del job se evalúa antes de entrar al
  # environment, así que una variable del environment ahí llega vacía.
  #
  # Vercel despliega la app en paralelo, así que durante unos minutos el código
  # nuevo puede correr contra la base vieja: toda migración tiene que tolerar
  # convivir con el código anterior y con el nuevo.
  deploy-migrations:
    name: migraciones a producción
    needs: [build, db]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vincular el proyecto hosted
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"

      # Queda en el log qué se va a aplicar antes de aplicarlo.
      - name: Migraciones pendientes
        run: supabase db push --linked --dry-run --skip-vault --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migraciones
        run: supabase db push --linked --skip-vault --yes --password "$SUPABASE_DB_PASSWORD"
